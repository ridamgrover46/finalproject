<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadgets World</title>
    <link rel="icon" type="image/x-icon" href="images/game-controller.png">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: rgb(22, 145, 128);
            color: white;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 100;
        }

        nav h1 a {
            color: white;
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav ul a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
            padding: 8px 15px;
            transition: 0.3s;
        }

        nav ul a:hover {
            background: teal;
            border-radius: 5px;
        }

        nav .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        nav .auth-buttons a button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: teal;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        nav .auth-buttons a button:hover {
            background: #1abc9c;
        }

        /* Banner Section */
        .banner {
            background-image: url('images/banner.jpg');
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-size: cover;
            background-position: center;
            color: white;
            flex-direction: column;
            padding: 20px;
        }

        .banner h2 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        .banner p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            nav ul {
                flex-direction: column;
            }

            .banner h2 {
                font-size: 2rem;
            }

            .banner p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <h1><a href="index.html">Gadgets World</a></h1>
        <ul>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="categories.html">Categories</a>
            <a href="contact.html">Contact</a>
        </ul>
        <div class="search-box">
            <input type="text" placeholder="Search...">
        </div>
        <div class="auth-buttons">
            <a href="login.html"><button>Login</button></a>
            <a href="signup.html"><button>Signup</button></a>
        </div>
    </nav>

    <!-- Banner -->
    <div class="banner">
       
    </div>

</body>
</html>
